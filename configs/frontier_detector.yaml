# Frontier-LLM detector: H3a comparator (c) in docs/paper_plan.md (amendment A7).
# Frozen 2026-10-28, before any scoring. Never edited after the first scored row; a change is a new file
# (frontier_detector_v2.yaml) and both versions are reported.

name: frontier_detector_v1
basis: "PromptArmor-style (Shi et al., arXiv:2507.15219), adapted to include the user request"

model:
  provider: openai
  endpoint: chat.completions
  id: gpt-4.1-2025-04-14          # dated snapshot of GPT-4.1, PromptArmor's best-reported detector (lowest ASR)
  fallback_id: gpt-4.1-mini-2025-04-14
  # Fallback rule: used only if the primary id is unavailable when scoring starts (API returns model-not-found
  # or the snapshot is past shutdown). The decision is made and committed before the first scored row; models
  # are never mixed and never switched after scoring starts.
  # Both snapshots are deprecated, with API shutdown on 2027-01-14
  # (https://developers.openai.com/api/docs/deprecations, read 2026-10-28). Scoring must finish before then.

prompt:
  file: configs/prompts/frontier_detector_v1.json
  sha256: b585a82a910d0827e444477a213621b0ffe1d4eb8a9a8b3a5be1b449f6da80c6
  fields: {intent: "user request (agent task prompt / pair query / V3 intent)", context: "tool output or document"}

request:
  temperature: 0
  max_tokens: 1
  logprobs: true
  top_logprobs: 20
  n: 1

score:
  # First generated token. Over its top_logprobs alternatives:
  #   P(Yes) = sum of exp(logprob) over tokens t with t.strip().lower() == "yes"
  #   P(No)  = sum of exp(logprob) over tokens t with t.strip().lower() == "no"
  #   score  = P(Yes) / (P(Yes) + P(No))
  # If neither appears in the top 20: score is missing; the row is counted and reported, never imputed.
  rule: first_token_yes_no_renormalized
  case_and_whitespace_variants: summed
  # If the API returns no logprobs for the pinned model: stop scoring and report. No verbalized-confidence fallback.
  on_missing_logprobs: stop

scope:
  # Scored in exactly this order. A set is started only if the remaining budget covers its estimated cost
  # x 1.2; otherwise scoring stops and that set and all later ones are reported as "not scored (budget)".
  # A set is reported only if every row is scored. Within a set, rows are sent in ascending id order.
  order:
    - calibration_pool          # agent-style clean pool (A3), >= 1,000 rows
    - pairs_v3_test             # adjudicated eval pairs from V3 test docs
    - pairs_agent               # adjudicated eval pairs from agent tool outputs
    - ad_matched
    - ad_shift
    - tb_matched                # TB-Matched injected + TB-Clean
    - v3_split_seed_0           # test.csv + raw_clean and ambiguous rows of test docs
  # No other sets. Never scored on any training data.

budget:
  cap_usd: 60
  pricing_source: "https://developers.openai.com/api/docs/pricing (read 2026-10-28)"
  pricing_per_1m_tokens:
    gpt-4.1: {standard_input: 2.00, cached_input: 0.50, standard_output: 8.00, batch_input: 1.00, batch_output: 4.00}
    gpt-4.1-mini: {standard_input: 0.40, cached_input: 0.10, standard_output: 1.60, batch_input: 0.20, batch_output: 0.80}
  # Spend is computed from the usage fields the API returns, at standard prices (conservative), and checked
  # before every request.
  # Estimate made 2026-10-28 (o200k_base tokenizer; prompt overhead 82 tokens; V3 seed 0 measured on a draft build;
  # agent-set context length NOT yet measured, so three scenarios). 7,839 rows; output 1 token each:
  #   agent context 300 tokens/row:  3.35M input tokens -> $6.76 standard, $3.38 batch
  #   agent context 800 tokens/row:  6.56M input tokens -> $13.19 standard, $6.60 batch
  #   agent context 2000 tokens/row: 14.28M input tokens -> $28.62 standard, $14.31 batch
  # Re-estimated from the real sets (exact token counts) before scoring starts; the re-estimate is committed.
