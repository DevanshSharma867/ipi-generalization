status: v6-frozen
# Intent-pair generation config (docs/pairs_spec.md v3 §8; paper_plan A18, A24, A26, A27, A28). Frozen before any
# generation call: a change is a new file and all versions are reported. v2 (A27): prompts v2 (rule E5).
# v3 (A28): adds quads_per_doc agent: 2 to eval (agent-derived secondary set); prompts (v2), decoding, seed and
# every other setting unchanged from pairs_gen_v2.yaml.
# v4 (A29): TRAIN prompt v3 (pairs_train_v3.txt); the EVAL prompt (v2), decoding, seed, modes and quads per doc are
# unchanged from pairs_gen_v3.yaml. Code from the same amendment regenerates a failed quad up to 3 times.
# v5 (A32): adds mode val (TRAIN generator and prompt on split-seed-0 V3 val docs: the held-out TRAIN-side pairs for
# ICT selection, A22) and the TRAIN-side self-consistency filter (spec §8). Generators, prompts, decoding, seed and
# the eval/train/timing modes are unchanged from pairs_gen_v4.yaml.
# v6 (docs/deviations.md 2026-11-11): TRAIN and val generation move to Kaggle T4 GPUs, which have no bf16, so
# gen-train-mistral runs in fp16 (the self-consistency filter, which uses the same model, too). Prompts, decoding,
# seed, modes, quads per doc, validation and the self-check rule are unchanged from pairs_gen_v5.yaml.
# Repo and revision of each generator come from configs/detectors.yaml (role: generator), the single pin.
spec_version: 3
seed: 20261104            # per-quad seed = sha256("<seed>:<quad_id>"); positions/separators seeded from it too
generators:
  gen-eval-gemma:         # google/gemma-3-27b-it, A24
    prompt: configs/prompts/pairs_eval_v2.txt
    precision: nf4        # bitsandbytes 4-bit NF4, bf16 compute
    model_class: image-text-to-text   # Gemma3ForConditionalGeneration; text-only input
    decoding: {do_sample: true, temperature: 0.7, top_p: 0.95, max_new_tokens: 900}
  gen-train-mistral:      # mistralai/Mistral-7B-Instruct-v0.3, A18 Q3
    prompt: configs/prompts/pairs_train_v3.txt
    precision: fp16       # v6: T4 has no bf16 (v5: bf16)
    model_class: causal-lm
    decoding: {do_sample: true, temperature: 0.8, top_p: 0.95, max_new_tokens: 900}
modes:
  eval:                   # V3 test docs of split seed 0 only (A18 Q1); quads per doc: spec §6
    generators: [gen-eval-gemma]
    split_seed: 0
    quads_per_doc: {email: 2, code: 2, table: 1, agent: 2}   # agent: A28 (AD-Clean docs, secondary set)
  train:                  # V3 train docs; quads per doc: spec §8
    generators: [gen-train-mistral]
    quads_per_doc: {email: 6, code: 6, table: 3}
  val:                    # A32: V3 val docs of split seed 0; TRAIN generator and prompt, train's quads per doc
    generators: [gen-train-mistral]
    split_seed: 0
    quads_per_doc: {email: 6, code: 6, table: 3}
  timing:                 # V3 val docs of split seed 0; outputs discarded (A24)
    generators: [gen-eval-gemma, gen-train-mistral]
    split_seed: 0
    quads_per_doc: {email: 1, code: 1, table: 1}
selfcheck:                # spec §8 TRAIN filter (A32): blind label of each member, prefill only, argmax of A/B;
  generator: gen-train-mistral   # a pair is kept only if both members get their intended label
  prompt: configs/prompts/pairs_selfcheck_v1.txt
  modes: [train, val]      # never eval: humans label every EVAL pair
