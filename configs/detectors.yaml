# Registry of every Hugging Face model the transfer harness scores or builds on (paper_plan §3, A1, A17).
# eval/transfer/prefetch.py downloads each at `revision` into HF_HOME and reports access for gated ones.
#
# revision: the commit every run loads. Pinned 2026-10-29 by `python eval/transfer/prefetch.py pin` to the head of
# `main` on that day (last_modified records when that head was committed), except where a source names one:
#   - horizon-base: the revision Liu (2026) scored (his README, check_revision.py; the model changed 2026-10-02).
#   - deberta-v3-base: the snapshot our V2 DeBERTa runs used (src/models/deberta.py).
# Liu does not record revisions for the other detectors. If a model changed after he scored it, the reproduction
# (Gate 2) shows it as a score mismatch on that detector; we then look for the matching revision, as he did for
# Horizon, and record it here as a new pin with its reason.
#
# injecguard: the Hub redirects leolee99/InjecGuard to leolee99/PIGuard (same commit), and Liu's released
# injecguard__* scores equal his piguard__* scores exactly (max |diff| 0 on adclean, admatched, bipia; 2026-10-29).
# Kept so his table reproduces row for row; it is not an independent detector.
# wolf-defender (2026-10-24) and prismor-1.5b (2026-10-21) changed shortly before Liu's last repo commit
# (2026-10-26): first suspects if Gate 2 mismatches.
#
# role: liu    in Liu's score_many.py DETECTORS (name = his key; sheltron's three variants share one repo)
#       judge  task-aware LLM judge, Liu's hf_judge.py (4-bit) and our H3 comparator (a)
#       ours   base model of our own detectors
